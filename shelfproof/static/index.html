<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreShelf</title>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.core.js">
<script>document.documentElement.dataset.theme = localStorage.getItem("preshelf:theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
<style>
  :root {
    --bg: #fbfaf8; --surface: #ffffff; --sunken: #efedea; --canvas: #e6e3de;
    --text: #1d1c1a; --muted: #6a665f; --line: #dedad3; --line-strong: #c9c4bb;
    --accent: #b8402a; --accent-hover: #9e3421; --accent-soft: #f7e3dd; --accent-text: #ffffff;
    --focus: #b8402a; --ok-bg: #e6f1e3; --ok-text: #24501d; --ok-line: #b9d4b1;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #161615; --surface: #1e1e1c; --sunken: #262624; --canvas: #0f0f0e;
    --text: #ecebe8; --muted: #a6a29a; --line: #34332f; --line-strong: #4a4843;
    --accent: #e0644a; --accent-hover: #ec7a61; --accent-soft: #3a2420; --accent-text: #1a0d0a;
    --focus: #ef8a73; --ok-bg: #1f2e1b; --ok-text: #cfe8c6; --ok-line: #3d5a35;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button, .btn { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px;
    min-height: 34px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; }
  button:hover:not(:disabled), .btn:hover { background: var(--sunken); }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn { width: 34px; padding: 0; justify-content: center; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app-header { display: flex; align-items: center; gap: 24px; height: 52px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  #brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  #brand strong { font-size: 17px; letter-spacing: -0.01em; }
  #brand strong span { color: var(--accent); }
  #brand small { color: var(--muted); font-size: 12px; }
  .app-nav { display: flex; align-self: stretch; gap: 4px; }
  .app-nav > * { border: 0; border-radius: 0; background: none; min-height: 0; padding: 0 10px; color: var(--muted); border-bottom: 2px solid transparent; }
  .app-nav > *:hover:not(:disabled) { background: none; color: var(--text); }
  .app-nav [aria-current="page"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .workspace { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 10px; }
  .work-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .work-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .work-title h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 4px; }
  #details { margin: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segmented { margin-left: auto; display: inline-flex; padding: 3px; gap: 2px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; }
  .segmented button { border: 0; background: none; min-height: 28px; padding: 4px 12px; border-radius: 6px; color: var(--muted); }
  .segmented button:hover:not(:disabled) { background: none; color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line-strong); }

  #viewer { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; position: relative; }
  #frame { position: relative; overflow: hidden; }
  canvas, #photo { display: block; width: 100%; height: 100%; }
  #photo { position: absolute; inset: 0; object-fit: contain; }
  #texture-pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 8px; margin: 0;
    padding: 3px 3px 3px 12px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-line); font-size: 13px; }
  #texture-pill button { min-height: 26px; padding: 2px 10px; border-radius: 999px; }

  .tool-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 36px; }
  .tool-group { display: flex; align-items: center; gap: 4px; }
  #status { flex: 1; text-align: center; color: var(--muted); overflow-wrap: anywhere; min-width: 180px; }
  #status.error { color: var(--accent); }
  .tool-end { display: flex; align-items: center; gap: 6px; }
  #note { margin: 0; color: var(--muted); font-size: 12px; }
  @media (max-width: 760px) {
    .app-header { gap: 12px; padding: 0 12px; overflow-x: auto; }
    #brand small, .upload-label { display: none; }
    .workspace { padding: 10px 12px 8px; }
    .segmented { margin-left: 0; }
    #status { order: -1; flex-basis: 100%; text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { button:active:not(:disabled) { transform: none; } }
</style>

<header class="app-header">
  <div id="brand"><strong>Pre<span>Shelf</span></strong><small>Test your pack before it hits the shelf</small></div>
  <nav class="app-nav" aria-label="Tools">
    <button type="button" aria-current="page">Shelf</button>
    <button id="packaging-lab" type="button" hidden>Packaging lab</button>
    <button id="placement-test" type="button" hidden>Placement test</button>
  </nav>
  <div class="header-actions">
    <form id="upload">
      <input id="image" class="sr-only" type="file" name="image" accept="image/*" required tabindex="-1" aria-hidden="true">
      <button id="make" type="button"><svg class="icon"><use href="#i-upload"/></svg><span class="upload-label">Upload shelf photo</span><span class="sr-only">Upload shelf photo</span></button>
    </form>
    <button id="theme" type="button" class="icon-btn" aria-label="Switch to dark theme"><svg class="icon"><use href="#i-moon"/></svg></button>
  </div>
</header>
<div class="workspace">
  <div class="work-bar">
    <div class="work-title">
      <h1 id="shelf-name">Shelf</h1>
      <span id="sample-tag" class="tag" hidden>Sample</span>
      <p id="details" hidden></p>
    </div>
    <nav id="modes" class="segmented" aria-label="View" hidden>
      <button type="button" data-mode="mesh" aria-pressed="false">3D shelf</button>
      <button type="button" data-mode="photo" aria-pressed="false">Photo</button>
      <button type="button" data-mode="splat" aria-pressed="false">Legacy splat</button>
    </nav>
  </div>
  <main id="viewer" aria-label="Shelf scene viewer">
    <p id="texture-pill" hidden><span id="texture-label" aria-live="polite"></span><button type="button" id="texture-reset">Back to original</button></p>
    <div id="frame"><img id="photo" alt="Original full-resolution shelf photo" hidden></div>
  </main>
  <div class="tool-bar">
    <nav id="orbit" class="tool-group" aria-label="Camera" hidden>
      <button type="button" class="icon-btn" data-orbit="left" aria-label="Orbit left"><svg class="icon"><use href="#i-left"/></svg></button>
      <button type="button" class="icon-btn" data-orbit="right" aria-label="Orbit right"><svg class="icon"><use href="#i-right"/></svg></button>
      <button type="button" class="icon-btn" data-orbit="up" aria-label="Orbit up"><svg class="icon"><use href="#i-up"/></svg></button>
      <button type="button" class="icon-btn" data-orbit="down" aria-label="Orbit down"><svg class="icon"><use href="#i-down"/></svg></button>
      <button type="button" class="icon-btn" data-orbit="out" aria-label="Zoom out"><svg class="icon"><use href="#i-minus"/></svg></button>
      <button type="button" class="icon-btn" data-orbit="in" aria-label="Zoom in"><svg class="icon"><use href="#i-plus"/></svg></button>

    <span id="status" role="status">Loading…</span>
    <div class="tool-end">
      <button id="flip" type="button" hidden>Flip splat</button>
      <button id="reset" type="button" hidden><svg class="icon"><use href="#i-reset"/></svg>Reset view</button>
      <a id="download" class="btn" hidden download><svg class="icon"><use href="#i-download"/></svg><span id="download-label">Download GLB</span></a>
    </div>
  </div>
  <p id="note">Visible surfaces are estimated from one photo; hidden sides aren't reconstructed. Drag to orbit, scroll to zoom. Uploads up to 20 MB.</p>
</div>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
    }
  }
</script>
<script type="module" src="/static/packaging.js"></script>
<script type="module" src="/static/placement.js"></script>
<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

  const $ = (id) => document.getElementById(id);
  const modeButtons = [...document.querySelectorAll("[data-mode]")];
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch {
    $("status").textContent = "3D needs WebGL2. Try a browser with hardware acceleration enabled.";
    $("make").disabled = true;
    throw new Error("WebGL2 unavailable");
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  $("frame").appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.enableDamping = false;
  controls.enabled = false;
  let currentJob, metadata, mode, object, cachedMesh, sparkRenderer, originalMap, swapToken = 0, busy = false;

  const render = () => { if (mode !== "photo") renderer.render(scene, camera); };
  controls.addEventListener("change", render);
  function setBusy(value) {
    busy = value;
    $("make").disabled = value;
    for (const button of modeButtons) button.disabled = value || (button.dataset.mode !== "splat" && !metadata);
    for (const id of ["reset", "flip"]) $(id).disabled = value;
    for (const button of document.querySelectorAll("[data-orbit]")) button.disabled = value;
    controls.enabled = !value && !!object && mode !== "photo";
  }

  function sourceProjection() {
    const [[fx, , cx], [, fy, cy]] = metadata.intrinsics;
    const n = camera.near;
    camera.projectionMatrix.makePerspective(-cx / fx * n, (1 - cx) / fx * n, cy / fy * n, -(1 - cy) / fy * n, n, camera.far);
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  }

  function resize() {
    const { width, height } = $("viewer").getBoundingClientRect();
    if (!width || !height) return;
    const aspect = metadata ? metadata.source_size[0] / metadata.source_size[1] : width / height;
    const w = Math.min(width, height * aspect), h = w / aspect;
    $("frame").style.width = `${w}px`;
    $("frame").style.height = `${h}px`;
    renderer.setSize(Math.max(1, Math.round(w)), Math.max(1, Math.round(h)), false);
    camera.aspect = aspect;
    if (metadata && mode === "mesh") sourceProjection();
    else camera.updateProjectionMatrix();
    render();
  }
  new ResizeObserver(resize).observe($("viewer"));

  function resetView() {
    camera.up.set(0, 1, 0);
    if (mode === "mesh") {
      const z = metadata.camera.target[2], distance = -z;
      camera.near = Math.max(0.0001, distance * 0.001);
      camera.far = Math.max(100, distance * 100);
      camera.position.set(0, 0, 0);
      camera.quaternion.identity();
      controls.target.set(0, 0, z);
      controls.minDistance = distance * 0.25;
      controls.maxDistance = distance * 3;
      controls.minAzimuthAngle = -Math.PI / 3;
      controls.maxAzimuthAngle = Math.PI / 3;
      controls.minPolarAngle = Math.PI / 6;
      controls.maxPolarAngle = 5 * Math.PI / 6;
    } else {
      camera.near = 0.01;
      camera.far = 100;
      camera.position.set(0, 0, Math.max(1.8, 1.5 / camera.aspect));
      controls.target.set(0, 0, 0);
      controls.minDistance = 0.1;
      controls.maxDistance = 20;
      controls.minAzimuthAngle = -Infinity;
      controls.maxAzimuthAngle = Infinity;
      controls.minPolarAngle = 0;
      controls.maxPolarAngle = Math.PI;
    }
    controls.update();
    resize();
  }

  function disposeMesh(root) {
    const geometries = new Set(), materials = new Set(), textures = new Set();
    root.traverse((child) => {
      if (child.geometry) geometries.add(child.geometry);
      for (const material of Array.isArray(child.material) ? child.material : child.material ? [child.material] : []) {
        materials.add(material);
        for (const value of Object.values(material)) if (value?.isTexture) textures.add(value);
      }
    });
    for (const texture of textures) texture.dispose();
    for (const material of materials) material.dispose();
    for (const geometry of geometries) geometry.dispose();
  }

  function meshMaterials() {
    const out = [];
    if (mode === "mesh") object?.traverse((child) => { if (child.isMesh) out.push(...[child.material].flat()); });
    return out.filter((material) => material.map);
  }
  function setMap(map) {
    for (const material of meshMaterials()) { material.map = map; material.needsUpdate = true; }
  }
  function dropSwap() {
    const current = meshMaterials()[0]?.map;
    if (originalMap && current && current !== originalMap) { setMap(originalMap); current.dispose(); }
    $("texture-pill").hidden = true;
  }
  function resetTexture() {
    swapToken++;
    const swapped = !$("texture-pill").hidden;
    dropSwap();
    render();
    if (swapped && metadata && mode === "mesh") $("status").textContent = "Original shelf";
  }
  async function showTexture(url, label = "Concept") {
    const token = ++swapToken;
    try {
      while (busy) await new Promise((r) => setTimeout(r, 100));
      if (token !== swapToken) return false;
      if (!currentJob || !metadata) throw new Error("Textured 3D is not available for this job.");
      if (mode !== "mesh") {
        setBusy(true);
        try { await show("mesh"); } finally { setBusy(false); }
      }
      if (token !== swapToken) return false;
      const target = object;
      $("status").textContent = `Loading ${label}…`;
      const texture = await new THREE.TextureLoader().loadAsync(url);
      if (token !== swapToken || object !== target || !originalMap) { texture.dispose(); return false; }
      const a = originalMap.image, b = texture.image;
      if (a?.width && Math.abs(b.width / b.height - a.width / a.height) > 0.01) {
        texture.dispose();
        throw new Error(`${label} is ${b.width} × ${b.height} px but the shelf photo is ${a.width} × ${a.height} px, so it cannot be mapped onto the 3D shelf.`);
      }
      for (const key of ["flipY", "wrapS", "wrapT", "magFilter", "minFilter", "anisotropy", "channel", "generateMipmaps"]) texture[key] = originalMap[key];
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      dropSwap();
      setMap(texture);
      $("texture-label").textContent = `Showing: ${label}`;
      $("texture-pill").hidden = false;
      $("status").textContent = `${label} · drag to orbit`;
      render();
      return true;
    } catch (error) {
      if (token === swapToken) reportError(error);
      return false;
    }
  }
  window.shelfproof = Object.assign(window.shelfproof || {}, { showTexture, resetTexture });
  $("texture-reset").onclick = resetTexture;

  function clearView(release = false) {
    renderer.setAnimationLoop(null);
    controls.enabled = false;
    if (object) {
      dropSwap();
      scene.remove(object);
      if (mode === "splat") object.dispose();
      else if (object !== cachedMesh) disposeMesh(object);
      object = undefined;
      originalMap = undefined;
    }
    if (release && cachedMesh) { disposeMesh(cachedMesh); cachedMesh = undefined; }
    if (sparkRenderer) { scene.remove(sparkRenderer); sparkRenderer.dispose(); sparkRenderer = undefined; }
    $("photo").hidden = true;
    if (release) $("photo").removeAttribute("src");
    for (const id of ["reset", "flip", "orbit", "download"]) $(id).hidden = true;
    render();
  }

  function reportError(error) {
    $("status").textContent = `${error.message} Try again or choose another photo.`;
    $("status").classList.add("error");
  }
  new MutationObserver(() => { if (!$("status").textContent.includes("Try again")) $("status").classList.remove("error"); })
    .observe($("status"), { childList: true });
  async function json(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Could not load scene (${res.status}).`);
    return res.json();
  }
  function loadProgress(event) {
    if (event.lengthComputable) $("status").textContent = `Loading view… ${Math.round(event.loaded / event.total * 100)}%`;
  }

  async function show(nextMode) {
    clearView();
    mode = nextMode;
    const base = `/api/jobs/${currentJob}`;
    $("status").textContent = `Loading ${mode === "mesh" ? "3D shelf" : mode === "photo" ? "photo" : "legacy splat"}…`;
    for (const button of modeButtons) button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
    resize();
    if (mode === "mesh") {
      if (!cachedMesh) {
        const image = $("photo");
        if (image.getAttribute("src") !== `${base}/source.png` || (image.complete && !image.naturalWidth)) image.src = `${base}/source.png`;
        image.decode().then(() => { if (mode === "mesh" && !object) image.hidden = false; }).catch(() => {});
        const gltf = await new GLTFLoader().loadAsync(`${base}/mesh.glb`, loadProgress);
        object = gltf.scene;
        const oldMaterials = new Set(), unusedTextures = new Set(), keptTextures = new Set();
        object.traverse((child) => {
          if (!child.isMesh) return;
          const unlit = (material) => {
            oldMaterials.add(material);
            if (material.map) keptTextures.add(material.map);
            for (const value of Object.values(material)) if (value?.isTexture) unusedTextures.add(value);
            return new THREE.MeshBasicMaterial({ map: material.map, side: THREE.DoubleSide, toneMapped: false });
          };
          child.material = Array.isArray(child.material) ? child.material.map(unlit) : unlit(child.material);
        });
        for (const material of oldMaterials) material.dispose();
        for (const texture of unusedTextures) if (!keptTextures.has(texture)) texture.dispose();
        cachedMesh = object;
      }
      object = cachedMesh;
      scene.add(object);
      originalMap = meshMaterials()[0]?.map;
      resetView();
      $("photo").hidden = true;
      $("status").textContent = "Drag to orbit · scroll to zoom";
    } else if (mode === "photo") {
      const image = $("photo");
      if (image.getAttribute("src") !== `${base}/source.png` || (image.complete && !image.naturalWidth)) image.src = `${base}/source.png`;
      await image.decode();
      image.hidden = false;
      $("status").textContent = "Original photo · full resolution";
    } else {
      const { SparkRenderer, SplatMesh, SplatLoader } = await import("@sparkjsdev/spark");
      sparkRenderer = new SparkRenderer({ renderer });
      scene.add(sparkRenderer);
      const packedSplats = await new SplatLoader().loadAsync(`${base}/scene.ply`, loadProgress);
      object = new SplatMesh({ packedSplats });
      await object.initialized;
      scene.add(object);
      resetView();
      renderer.setAnimationLoop(render);
      $("status").textContent = `Legacy depth relief · ${packedSplats.numSplats.toLocaleString()} splats`;
    }
    const is3D = mode !== "photo";
    $("reset").hidden = $("orbit").hidden = !is3D;
    $("flip").hidden = mode !== "splat";
    $("download").hidden = false;
    const downloadMesh = mode !== "splat" && metadata;
    $("download").href = `${base}/${downloadMesh ? "mesh.glb" : "scene.ply"}`;
    $("download-label").textContent = downloadMesh ? "Download GLB" : "Download PLY";
    $("download").download = `${currentJob}.${downloadMesh ? "glb" : "ply"}`;
    render();
  }

  function validateMetadata(data) {
    const [w, h] = data.source_size || [];
    const k = data.intrinsics;
    if (!(w > 0 && h > 0) || !k?.every((row) => row.length === 3 && row.every(Number.isFinite)) || k.length !== 3 || !(k[0][0] > 0 && k[1][1] > 0) || !Number.isFinite(data.camera?.target?.[2]) || !(data.camera.target[2] < 0)) {
      throw new Error("Invalid source camera metadata.");
    }
    return data;
  }

  async function poll(jobId) {
    if (!/^[0-9a-f]{12}$/.test(jobId)) throw new Error("Invalid job link.");
    history.replaceState(null, "", `?job=${jobId}`);
    swapToken++;
    clearView(true);
    metadata = undefined;
    mode = undefined;
    $("modes").hidden = $("details").hidden = true;
    resize();
    for (;;) {
      const job = await json(`/api/jobs/${jobId}`);
      if (job.state === "done") {
        currentJob = jobId;
        if (job.representation === "textured-mesh") metadata = validateMetadata(job.metadata || await json(`/api/jobs/${jobId}/scene.json`));
        $("modes").hidden = false;
        $("details").hidden = false;
        const sample = jobId === SAMPLE_JOB;
        $("shelf-name").textContent = sample ? "Tesco Easter aisle" : "Your shelf";
        $("sample-tag").hidden = !sample;
        $("details").textContent = metadata
          ? `${metadata.source_size.join(" × ")} px photo · ${(metadata.triangle_count / 1e6).toFixed(1)}M-triangle mesh`
          : "Legacy scene · photo and 3D mesh unavailable for this job";
        $("details").title = metadata ? `Geometry ${metadata.geometry_size.join(" × ")} px · ${metadata.model}` : "";
        return show(metadata ? "mesh" : "splat");
      }
      if (job.state === "failed") throw new Error(job.error || "Reconstruction failed.");
      $("status").textContent = "Building 3D from photo… Jobs may queue; keep this tab open.";
      await new Promise((r) => setTimeout(r, 2000));
    }
  }

  const SAMPLE_JOB = "38c17fd769fe";
  $("make").onclick = () => $("image").click();
  $("image").addEventListener("change", () => { if ($("image").files[0]) $("upload").requestSubmit(); });
  function syncTheme() {
    const dark = document.documentElement.dataset.theme === "dark";
    $("theme").setAttribute("aria-label", `Switch to ${dark ? "light" : "dark"} theme`);
    $("theme").querySelector("use").setAttribute("href", dark ? "#i-sun" : "#i-moon");
  }
  $("theme").onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("preshelf:theme", next);
    syncTheme();
  };
  syncTheme();
  $("upload").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    const file = $("image").files[0];
    if (!file || file.size > 20 * 1024 * 1024) { reportError(new Error("Choose an image no larger than 20 MB.")); return; }
    setBusy(true);
    $("status").textContent = "Uploading…";
    try {
      const res = await fetch("/api/jobs", { method: "POST", body: new FormData(e.target) });
      if (!res.ok) throw new Error(`Upload failed (${res.status}).`);
      await poll((await res.json()).job_id);
    } catch (error) { reportError(error); }
    finally { setBusy(false); }
  });
  for (const button of modeButtons) button.onclick = async () => {
    if (busy || !currentJob || (button.dataset.mode === mode && (mode === "photo" || object))) return;
    setBusy(true);
    try { await show(button.dataset.mode); }
    catch (error) { clearView(); reportError(error); }
    finally { setBusy(false); }
  };
  $("reset").onclick = resetView;
  $("flip").onclick = () => { object?.rotateX(Math.PI); render(); };
  for (const button of document.querySelectorAll("[data-orbit]")) button.onclick = () => {
    if (busy || !object) return;
    const direction = button.dataset.orbit;
    const offset = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    if (direction === "left") offset.theta -= 0.15;
    if (direction === "right") offset.theta += 0.15;
    if (direction === "up") offset.phi -= 0.15;
    if (direction === "down") offset.phi += 0.15;
    if (direction === "in") offset.radius *= 0.85;
    if (direction === "out") offset.radius /= 0.85;
    offset.theta = THREE.MathUtils.clamp(offset.theta, controls.minAzimuthAngle, controls.maxAzimuthAngle);
    offset.phi = THREE.MathUtils.clamp(offset.phi, controls.minPolarAngle, controls.maxPolarAngle);
    offset.radius = THREE.MathUtils.clamp(offset.radius, controls.minDistance, controls.maxDistance);
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(offset));
    controls.update();
    render();
  };

  resize();
  const initial = new URLSearchParams(location.search).get("job");
  if (initial) {
    setBusy(true);
    poll(initial).catch((error) => { clearView(); reportError(error); }).finally(() => setBusy(false));
  }
</script>
</html>
