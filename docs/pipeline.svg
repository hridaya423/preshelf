<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612">
  <title>PreShelf pipeline: one shelf photo feeds three tracks: 3D reconstruction, packaging redesign, and shelf position testing</title>
  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; fill: #1f1d1a; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .kicker { font-size: 11px; letter-spacing: 0.14em; fill: #a4492a; }
    .h1 { font-size: 27px; }
    .num { font-size: 12px; fill: #a4492a; }
    .rowt { font-size: 19px; }
    .note { font-size: 11.5px; fill: #8a847a; }
    .tag { font-size: 10px; letter-spacing: 0.03em; fill: #a4492a; }
    .t { font-size: 14px; font-weight: 600; fill: #1f1d1a; }
    .d { font-size: 12.5px; fill: #6b665e; }
    .rule { stroke: #e2ddd3; stroke-width: 1; }
    .track { stroke: #cfc8bb; stroke-width: 1.2; }
    .node { fill: #f7f4ee; stroke: #1f1d1a; stroke-width: 1.4; }
    .end { fill: #a4492a; }
    .wire { fill: none; stroke: #1f1d1a; stroke-width: 1.2; }
  </style>

  <rect width="1200" height="612" fill="#f7f4ee"/>

  <text x="40" y="50" class="mono kicker">PRESHELF · PIPELINE</text>
  <text x="40" y="84" class="serif h1">One shelf photo, three answers</text>

  <!-- source -->
  <g transform="translate(40 222)">
    <rect width="180" height="180" rx="6" fill="#fffdf9" stroke="#1f1d1a" stroke-width="1.2"/>
    <g transform="translate(20 20)">
      <rect width="140" height="96" fill="#ebe6dc"/>
      <g fill="#cfc6b6"><rect y="30" width="140" height="2"/><rect y="62" width="140" height="2"/><rect y="94" width="140" height="2"/></g>
      <rect x="6" y="9" width="12" height="21" fill="#d9a441"/><rect x="20" y="9" width="12" height="21" fill="#d9a441"/><rect x="36" y="13" width="16" height="17" fill="#6c8fb3"/><rect x="54" y="13" width="16" height="17" fill="#6c8fb3"/><rect x="74" y="7" width="11" height="23" fill="#c46a5a"/><rect x="87" y="7" width="11" height="23" fill="#c46a5a"/><rect x="102" y="11" width="15" height="19" fill="#7fa37a"/><rect x="119" y="11" width="15" height="19" fill="#7fa37a"/>
      <rect x="6" y="41" width="18" height="21" fill="#9c86b5"/><rect x="26" y="41" width="18" height="21" fill="#9c86b5"/><rect x="49" y="38" width="21" height="24" fill="#e2b64f" stroke="#1f1d1a" stroke-width="1.5"/><rect x="75" y="44" width="15" height="18" fill="#d08a52"/><rect x="92" y="44" width="15" height="18" fill="#d08a52"/><rect x="111" y="41" width="11" height="21" fill="#5f9e9a"/><rect x="124" y="41" width="11" height="21" fill="#5f9e9a"/>
      <rect x="6" y="73" width="22" height="21" fill="#a98868"/><rect x="31" y="73" width="22" height="21" fill="#a98868"/><rect x="57" y="76" width="16" height="18" fill="#c46a5a"/><rect x="77" y="71" width="18" height="23" fill="#6c8fb3"/><rect x="99" y="76" width="15" height="18" fill="#7fa37a"/><rect x="118" y="75" width="16" height="19" fill="#d9a441"/>
    </g>
    <text x="20" y="142" class="serif" font-size="16">Shelf photo</text>
    <text x="20" y="162" class="sans note">your product outlined</text>
  </g>

  <path class="wire" d="M220,312 H250 M250,162 V462 M250,162 H266 M250,312 H266 M250,462 H266"/>
  <circle cx="250" cy="312" r="2.6" fill="#1f1d1a"/>

  <line class="rule" x1="280" y1="110" x2="1160" y2="110"/>
  <line class="rule" x1="280" y1="260" x2="1160" y2="260"/>
  <line class="rule" x1="280" y1="410" x2="1160" y2="410"/>
  <line class="rule" x1="280" y1="560" x2="1160" y2="560"/>

  <!-- 01 -->
  <text x="280" y="166" class="mono num">01</text>
  <text x="280" y="192" class="serif rowt">See it in 3D</text>
  <text x="280" y="212" class="sans note">about 20 s per photo</text>
  <line class="track" x1="470" y1="162" x2="1040" y2="162"/>
  <g class="sans">
    <text x="466" y="144" class="mono tag">MOGE-2 VIT-L</text>
    <circle class="node" cx="470" cy="162" r="4.5"/>
    <text x="466" y="192" class="t">Depth and normals</text>
    <text x="466" y="211" class="d">Metric geometry from</text>
    <text x="466" y="227" class="d">one photo, on an L4 GPU</text>

    <text x="656" y="144" class="mono tag">EDGE THRESHOLD 0.04</text>
    <circle class="node" cx="660" cy="162" r="4.5"/>
    <text x="656" y="192" class="t">Clean edges</text>
    <text x="656" y="211" class="d">Depth jumps are cut,</text>
    <text x="656" y="227" class="d">not smeared into walls</text>

    <text x="846" y="144" class="mono tag">FULL-RES TEXTURE</text>
    <circle class="node" cx="850" cy="162" r="4.5"/>
    <text x="846" y="192" class="t">Textured mesh</text>
    <text x="846" y="211" class="d">Your own photo wraps</text>
    <text x="846" y="227" class="d">the geometry</text>

    <text x="1036" y="144" class="mono tag">THREE.JS</text>
    <circle class="end" cx="1040" cy="162" r="5.5"/>
    <text x="1036" y="192" class="t">Orbit the aisle</text>
    <text x="1036" y="211" class="d">Drag, zoom and</text>
    <text x="1036" y="227" class="d">download the model</text>
  </g>

  <!-- 02 -->
  <text x="280" y="316" class="mono num">02</text>
  <text x="280" y="342" class="serif rowt">Redesign the pack</text>
  <text x="280" y="362" class="sans note">up to 4 concepts at once</text>
  <line class="track" x1="470" y1="312" x2="1040" y2="312"/>
  <g class="sans">
    <text x="466" y="294" class="mono tag">SAM 2.1 HIERA-L</text>
    <circle class="node" cx="470" cy="312" r="4.5"/>
    <text x="466" y="342" class="t">Cut out your product</text>
    <text x="466" y="361" class="d">One click or a box,</text>
    <text x="466" y="377" class="d">on a T4 GPU</text>

    <text x="656" y="294" class="mono tag">BRIEF</text>
    <circle class="node" cx="660" cy="312" r="4.5"/>
    <text x="656" y="342" class="t">Set the direction</text>
    <text x="656" y="361" class="d">Audience, price tier,</text>
    <text x="656" y="377" class="d">tone, keep and avoid</text>

    <text x="846" y="294" class="mono tag">GPT IMAGE · NANO BANANA PRO</text>
    <circle class="node" cx="850" cy="312" r="4.5"/>
    <text x="846" y="342" class="t">New packshot</text>
    <text x="846" y="361" class="d">Drawn from the real</text>
    <text x="846" y="377" class="d">pack and its shelf</text>

    <text x="1036" y="294" class="mono tag">MASKED EDIT</text>
    <circle class="end" cx="1040" cy="312" r="5.5"/>
    <text x="1036" y="342" class="t">Restock the photo</text>
    <text x="1036" y="361" class="d">Only the product's</text>
    <text x="1036" y="377" class="d">pixels change</text>
  </g>

  <!-- 03 -->
  <text x="280" y="466" class="mono num">03</text>
  <text x="280" y="492" class="serif rowt">Test the position</text>
  <text x="280" y="512" class="sans note">up to 8 slots × 6 shoppers</text>
  <line class="track" x1="470" y1="462" x2="1040" y2="462"/>
  <g class="sans">
    <text x="466" y="444" class="mono tag">SAM 2.1</text>
    <circle class="node" cx="470" cy="462" r="4.5"/>
    <text x="466" y="492" class="t">Map the shelf</text>
    <text x="466" y="511" class="d">Every product, grouped</text>
    <text x="466" y="527" class="d">into rows</text>

    <text x="656" y="444" class="mono tag">RE-STAGING</text>
    <circle class="node" cx="660" cy="462" r="4.5"/>
    <text x="656" y="492" class="t">Move the product</text>
    <text x="656" y="511" class="d">Swap or place it in</text>
    <text x="656" y="527" class="d">each candidate slot</text>

    <text x="846" y="444" class="mono tag">DEEPGAZE IIE</text>
    <circle class="node" cx="850" cy="462" r="4.5"/>
    <text x="846" y="492" class="t">Predict attention</text>
    <text x="846" y="511" class="d">Weighted by eye height,</text>
    <text x="846" y="527" class="d">distance and mission</text>

    <text x="1036" y="444" class="mono tag">RANKING</text>
    <circle class="end" cx="1040" cy="462" r="5.5"/>
    <text x="1036" y="492" class="t">Pick the slot</text>
    <text x="1036" y="511" class="d">Attention share, rank</text>
    <text x="1036" y="527" class="d">and share per £100</text>
  </g>

  <text x="280" y="590" class="sans note">Attention scores are model estimates under stated assumptions, not measured shopper behaviour.</text>
  <text x="1160" y="590" text-anchor="end" class="mono note">runs on Modal GPUs</text>
</svg>
